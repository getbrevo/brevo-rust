[package]
name = "brevo-rust"
version = "1.0.0"
edition = "2021"
description = "Official Rust SDK for the Brevo API."
license = "MIT"
repository = "https://github.com/getbrevo/brevo-rust"
documentation = "https://developers.brevo.com"

[lib]
doctest = false

[dependencies]
base64 = "0.22"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["multipart"]
multipart = ["reqwest/multipart"]
